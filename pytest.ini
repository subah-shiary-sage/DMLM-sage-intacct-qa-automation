[pytest]
testpaths = tests
pythonpath = .

# Test functions are named descriptively (e.g. "create_page_title_verification")
# rather than with a test_ prefix, so collection matches both that convention and
# the older test_* names still used by the other modules.
python_functions = test_* *_verification
markers =
    jira_iadssl_1792: Focused UI coverage for the IADSSL-1792 Depository Account Category workflow.
    api: Tests that validate backend/API behaviour (uniqueness, duplicate key checks).
        These should be supplemented with API-level tests.
    integration: End-to-end scenarios that combine UI + API (Bruno) + DB (Oracle).
        Skip automatically until Oracle/Bruno are configured in .env.
        Run just these with:  -m integration

# ── Reporting ─────────────────────────────────────────────────────────────────
# HTML report  : reports/report.html  (self-contained, no extra assets needed)
# JUnit XML    : reports/results.xml  (readable by CI systems)
addopts =
    -v
    --html=reports/report.html
    --self-contained-html
    --junitxml=reports/results.xml
