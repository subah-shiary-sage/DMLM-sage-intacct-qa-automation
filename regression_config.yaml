# regression_config.yaml — module registry for run_regression.py
#
# Maps each --module name to the checklist sheet(s) it owns, the page objects
# that drive it, and its JIRA target.
#
# SECRETS: no token here. This file is committed to git. `token_env_var` names
# an environment variable (set it in .env, which is not committed) that holds
# the JIRA bearer token.

environment: "release www-p303, SNL_release_monthly, LME entity"
workbook: "Regression/LME_Regression_Consolidated.xlsx"

# Default JIRA target: the running LME defect list. Individual modules may
# override any of these keys with their own `jira:` block.
jira:
  issue: "IADSSL-1714"
  comment_id: "4855245"
  base_url: "https://jira.sage.com"
  token_env_var: "JIRA_API_TOKEN"

modules:

  # ── Modules with a live-verified page object ──────────────────────────────
  loan_type:
    page_object: "pages.loan_type.type_page.LoanTypePage"
    listing_page_object: "pages.loan_type.listing_page.LoanTypeListingPage"
    scenarios: "regression_automation.scenarios.loan_type"
    sheets:
      - name: "Loan Type - CRUD"
      # Shared sheet: this module owns only the "Loan type lister" block.
      - name: "Config Listers LT-LIR-LC-LFT"
        row_start: 7
        row_end: 9

  loan_interest_rate:
    page_object: "pages.loan_interest_rate.rate_page.LoanInterestRatePage"
    listing_page_object: "pages.loan_interest_rate.listing_page.LoanInterestRateListingPage"
    scenarios: "regression_automation.scenarios.loan_interest_rate"
    sheets:
      - name: "Loan Interest Rate - CRUD"
      - name: "Config Listers LT-LIR-LC-LFT"
        row_start: 11
        row_end: 13

  # NOTE: "Loan Category - CRUD" is the Lending Management *loan* account
  # category (snl.loan-category), NOT the Depository Management object in
  # pages/depository_category — those are different records.
  loan_category:
    page_object: "pages.loan_category.category_page.LoanCategoryPage"
    listing_page_object: "pages.loan_category.listing_page.LoanCategoryListingPage"
    scenarios: "regression_automation.scenarios.loan_category"
    sheets:
      - name: "Loan Category - CRUD"
      - name: "Config Listers LT-LIR-LC-LFT"
        row_start: 15
        row_end: 17

  # ── Sheets registered for reporting; page objects still to be written ─────
  # These can be inspected (--list-rows) and are included in report/Summary
  # recomputation, but cannot be executed until page_object + scenarios exist.
  loan_fee_type:
    page_object: "pages.loan_fee_type.fee_type_page.LoanFeeTypePage"
    listing_page_object: "pages.loan_fee_type.listing_page.LoanFeeTypeListingPage"
    scenarios: "regression_automation.scenarios.loan_fee_type"
    sheets:
      - name: "Loan Fee Type - CRUD"
      - name: "Config Listers LT-LIR-LC-LFT"
        row_start: 19
        row_end: 21

  loan_account:
    notes: "No page object yet — execution blocked, reporting only."
    sheets:
      - name: "Loan Account - CRUD"
      - name: "Loan Account - Lister"

  loan_adjustment:
    notes: "No page object yet — execution blocked, reporting only."
    sheets:
      - name: "Loan Adjustment - CRUD"

  loan_statements:
    notes: "No page object yet — execution blocked, reporting only."
    sheets:
      - name: "Loan Statements - Lister"

  lending_workbench:
    notes: >-
      pages/lending_workbench/workbench_page.py exists but its selectors have
      not been verified live; loan_account_page.py is self-flagged unverified.
      Reporting only until both are confirmed against the app.
    sheets:
      - name: "Lending Workbench - Lister"

  edit_view_delete:
    notes: "Cross-object checklist — no single page object. Reporting only."
    sheets:
      - name: "Edit-View-Delete + Update"
